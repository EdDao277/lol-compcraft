services:
  - type: web
    name: compcraft-ml
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_BUNDLE_URL
        sync: false
      - key: COACH_MODEL_URL
        sync: false
      - key: USE_NETWORK_STATS
        value: "false"
      - key: COACH_USE_NETWORK_STATS
        value: "false"
      - key: MAX_BATCH_CANDIDATES
        value: "24"
      - key: NETWORK_STATS_URL
        sync: false
